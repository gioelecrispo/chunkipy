[project]
name = "chunkipy"
version = "1.2.0"
description = "Chunkipy is an easy-to-use library for chunking text based on the size estimator function you provide."
readme = "README.md"
license = "MIT"
authors = [{ name = "Gioele Crispo", email = "crispogioele@gmail.com" }]
requires-python = ">=3.10,<3.14"
keywords = ["text", "chunking", "NLP", "tokenization"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["typing-extensions>=4.14.1"]

[project.urls]
Repository = "https://github.com/gioelecrispo/chunkipy"

[project.optional-dependencies]
# Language detectors
langdetect = ["langdetect>=1.0.9"]
fasttext = ["fasttext>=0.9.3"]
# NLP backends
spacy = ["spacy>=3.7.0"]
stanza = ["stanza>=1.4.2"]
# LLM integrations
openai = ["openai>=1.88.0"]
tiktoken = ["tiktoken>=0.9.0"]
# Logical feature groups
language-detection = ["langdetect>=1.0.9", "fasttext>=0.9.3"]
nlp = ["spacy>=3.7.0", "stanza>=1.4.2"]
ai = ["openai>=1.88.0", "tiktoken>=0.9.0"]
# All optional dependencies
all = [
    "langdetect>=1.0.9",
    "fasttext>=0.9.3",
    "spacy>=3.7.0",
    "stanza>=1.4.2",
    "openai>=1.88.0",
    "tiktoken>=0.9.0",
]
# pip editable convenience
dev = [
    "pytest>=7.0",
    "pytest-cov>=6.2.1",
    "ruff>=0.1.0",
    "black>=26.3.1",
    "sphinx==8.1.3",
    "sphinx-autodoc-typehints==3.0.1",
    "sphinx-multiversion>=0.2.4",
    "sphinx-rtd-theme==3.0.2",
    "sphinx-inline-tabs==2023.4.21",
]

[dependency-groups]
test = ["pytest>=7.0", "pytest-cov>=6.2.1"]
lint = ["ruff>=0.1.0", "black>=26.3.1"]
docs = [
    "sphinx==8.1.3",
    "sphinx-autodoc-typehints==3.0.1",
    "sphinx-multiversion>=0.2.4",
    "sphinx-rtd-theme==3.0.2",
    "sphinx-inline-tabs==2023.4.21",
]

[tool.setuptools.packages.find]
include = ["chunkipy*"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[tool.sphinx]
source-dir = "docs/source"
build-dir = "docs/build"
all-files = true

[tool.sphinx.upload]
upload-dir = "docs/build/html"
